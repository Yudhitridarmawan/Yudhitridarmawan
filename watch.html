<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memutar · LAYARIN</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0a0c'/><path d='M11 8v16l12-8z' fill='%23ff4761'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="player-page">

<div class="player-shell" id="shell">
  <video id="video" playsinline preload="metadata"></video>

  <div class="player-top">
    <a class="back-btn" href="index.html" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <div>
      <h1 id="title">—</h1>
      <div class="sub" id="subtitle"></div>
    </div>
  </div>

  <button class="big-play" id="bigPlay" aria-label="Putar">
    <i><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg></i>
  </button>

  <div class="spinner" id="spinner" hidden></div>
  <div class="toast" id="toast"></div>

  <div class="player-error" id="playerError" hidden>
    <div class="mark">!</div>
    <h2>Video tidak bisa dimuat</h2>
    <p id="playerErrorMsg">Berkas videonya gagal dimuat. Periksa koneksi internetmu lalu coba lagi,
       atau pilih judul lain.</p>
    <div class="acts">
      <button class="btn btn-play" id="retryBtn">Coba Lagi</button>
      <a class="btn btn-ghost" href="index.html">Kembali ke Beranda</a>
    </div>
  </div>

  <aside class="up-next" id="upNext" hidden>
    <div class="lbl">Berikutnya</div>
    <div class="row2">
      <div class="thumb" id="upNextThumb"></div>
      <div>
        <div class="t" id="upNextTitle"></div>
        <div class="d" id="upNextDesc"></div>
      </div>
    </div>
    <button class="go" id="upNextGo">Putar Episode Berikutnya</button>
  </aside>

  <div class="ctl-bar">
    <div class="scrub" id="scrub" role="slider" tabindex="0"
         aria-label="Posisi pemutaran" aria-valuemin="0" aria-valuenow="0">
      <div class="scrub-track">
        <div class="scrub-buffered" id="buffered"></div>
        <div class="scrub-played" id="played"></div>
      </div>
      <div class="scrub-knob" id="knob"></div>
      <div class="scrub-tip" id="tip">0:00</div>
    </div>

    <div class="ctl-row">
      <button class="ctl" id="playBtn" aria-label="Putar"></button>

      <button class="ctl" id="back10" aria-label="Mundur 10 detik">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7.5 6 12 10V7a5.5 5.5 0 1 1-5.5 5.5H4.5A7.5 7.5 0 1 0 12 5Z"/><text x="12" y="15.6" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg>
      </button>

      <button class="ctl" id="fwd10" aria-label="Maju 10 detik">
        <svg viewBox="0 0 24 24"><path d="M12 5V2l4.5 4L12 10V7a5.5 5.5 0 1 0 5.5 5.5h2A7.5 7.5 0 1 1 12 5Z"/><text x="12" y="15.6" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg>
      </button>

      <div class="vol">
        <button class="ctl" id="volBtn" aria-label="Bisukan"></button>
        <input id="volRange" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      </div>

      <div class="time"><span id="tCur">0:00</span> <b>/</b> <span id="tDur">0:00</span></div>

      <div class="spacer"></div>

      <button class="ctl wide" id="speedBtn" aria-label="Kecepatan pemutaran">1×</button>

      <button class="ctl" id="pipBtn" aria-label="Picture in picture">
        <svg viewBox="0 0 24 24"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5v-13Zm2 .5v12h14V6H5Z"/><rect x="11.5" y="11" width="7" height="5.5" rx="1"/></svg>
      </button>

      <button class="ctl" id="fsBtn" aria-label="Layar penuh">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM4 15h2v3h3v2H4v-5Zm16 0v5h-5v-2h3v-3h2Z"/></svg>
      </button>
    </div>
  </div>
</div>

<p class="kbd-hint">
  <kbd>Space</kbd> putar/jeda · <kbd>←</kbd><kbd>→</kbd> 10 detik · <kbd>↑</kbd><kbd>↓</kbd> volume ·
  <kbd>M</kbd> bisu · <kbd>F</kbd> layar penuh · <kbd>P</kbd> PiP · <kbd>0-9</kbd> lompat · <kbd>Esc</kbd> keluar
</p>

<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/watch.js"></script>
</body>
</html>
